name: Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-test:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ktq_admin
          POSTGRES_PASSWORD: ktq_secure_password_2026
          POSTGRES_DB: khadija_tul_qubrah_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Setup Database Schema
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://ktq_admin:ktq_secure_password_2026@localhost:5432/khadija_tul_qubrah_db?schema=public"
        run: npx prisma db push --skip-generate || true

      - name: Typecheck
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Run Linter
        working-directory: ./backend
        run: npm run lint || true

      - name: Run Unit & Integration Tests
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://ktq_admin:ktq_secure_password_2026@localhost:5432/khadija_tul_qubrah_db?schema=public"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: "test-secret"
          JWT_REFRESH_SECRET: "test-refresh-secret"
        run: npm test -- --passWithNoTests --forceExit

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend-admin
        run: npm ci --legacy-peer-deps

      - name: Build Next.js Application
        working-directory: ./frontend-admin
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
